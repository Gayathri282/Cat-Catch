<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cat Catch - Minimal Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cat-catch.css">
</head>
<body>
  <main id="gameShell">
    <canvas id="gameCanvas" aria-label="Cat Catch game canvas"></canvas>

    <!-- Top HUD Bar -->
    <header class="topbar">
      <div class="hud-group">
        <div class="hud-pill score-pill">
          <span class="hud-label">SCORE</span>
          <span id="score" class="hud-val">0</span>
        </div>
        <div class="hud-pill level-pill">
          <span class="hud-label">LEVEL</span>
          <span id="level" class="hud-val">1</span>
        </div>
        <div class="hud-pill combo-pill">
          <span class="hud-label">COMBO</span>
          <span id="combo" class="hud-val">0x</span>
        </div>
      </div>

      <button id="soundBtn" class="icon-btn" aria-label="Toggle Sound" title="Toggle Sound">
        <span class="sound-icon">🔊</span>
      </button>
    </header>

    <!-- Toast Notification Message -->
    <div id="message" class="toast-msg"></div>

    <!-- Start Overlay Modal -->
    <div id="startOverlay" class="overlay">
      <div class="modal-card">
        <div class="mascot-badge" id="menuMascot">🐱</div>
        
        <h1 class="game-title">Cat Catch</h1>
        <p class="game-subtitle">Catch treats, dodge rocks and bombs.</p>

        <!-- Skin Selector -->
        <div class="section-box">
          <span class="section-label">SELECT CAT</span>
          <div class="skin-selector">
            <button class="skin-btn active" data-skin="tabby">
              <span class="skin-emoji">🐱</span>
              <span class="skin-name">Classic</span>
            </button>
            <button class="skin-btn" data-skin="ninja">
              <span class="skin-emoji">🥷</span>
              <span class="skin-name">Shadow</span>
            </button>
            <button class="skin-btn" data-skin="rainbow">
              <span class="skin-emoji">🌈</span>
              <span class="skin-name">Pastel</span>
            </button>
            <button class="skin-btn" data-skin="space">
              <span class="skin-emoji">🚀</span>
              <span class="skin-name">Cosmic</span>
            </button>
          </div>
        </div>

        <!-- Rules Overview -->
        <div class="rules-row">
          <div class="rule-chip good"><span class="chip-icon">🐟</span><span>+15</span></div>
          <div class="rule-chip good"><span class="chip-icon">🧶</span><span>+20</span></div>
          <div class="rule-chip good"><span class="chip-icon">⭐</span><span>+30</span></div>
          <div class="rule-chip good"><span class="chip-icon">🍩</span><span>+50</span></div>
          <div class="rule-chip bad"><span class="chip-icon">🪨</span><span>Dodge</span></div>
          <div class="rule-chip bad"><span class="chip-icon">💣</span><span>Avoid</span></div>
        </div>

        <!-- Primary Action Button -->
        <button id="startBtn" class="primary-btn">
          <span>Start Game</span>
          <span class="btn-arrow">→</span>
        </button>

        <span class="control-hint">Use ← → arrow keys or tap screen sides</span>
      </div>
    </div>

    <!-- Game Over Overlay Modal -->
    <div id="gameOverOverlay" class="overlay hidden">
      <div class="modal-card">
        <div class="mascot-badge gameover-badge">🙀</div>

        <h2 class="game-title">Game Over</h2>
        <p id="gameOverReason" class="game-subtitle">You bumped into an obstacle!</p>

        <div class="score-summary">
          <div class="score-stat">
            <span class="stat-label">SCORE</span>
            <span id="finalScore" class="stat-val">0</span>
          </div>
          <div class="stat-divider"></div>
          <div class="score-stat">
            <span class="stat-label">BEST</span>
            <span id="bestScore" class="stat-val Highlight">0</span>
          </div>
        </div>

        <button id="restartBtn" class="primary-btn">
          <span>Play Again</span>
          <span class="btn-arrow">↻</span>
        </button>
      </div>
    </div>

    <!-- Touch Control Zones -->
    <div class="touch-zone left-zone" data-dir="left"></div>
    <div class="touch-zone right-zone" data-dir="right"></div>
  </main>

  <script src="cat-catch.js"></script>
</body>
</html>
